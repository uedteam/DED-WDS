    <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.2.0/dist/js/datepicker-full.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const datepickerInput = document.getElementById("ded-input");
        if (datepickerInput) {
          const datepicker = new Datepicker(datepickerInput, {
            autohide: true,
            format: "yyyy-mm-dd",
          });
        } else {
          console.error('Element with id "ded-input" not found.');
        }
        // 獲取開始與結束日期的輸入框
        const startDateInput = document.getElementById("start-date");
        const endDateInput = document.getElementById("end-date");

        // 初始化開始日期 Datepicker
        const startDatepicker = new Datepicker(startDateInput, {
          autohide: true,
          format: "yyyy-mm-dd",
        });

        // 初始化結束日期 Datepicker
        const endDatepicker = new Datepicker(endDateInput, {
          autohide: true,
          format: "yyyy-mm-dd",
        });

        // 監聽開始日期的變更，動態更新結束日期的最小值
        startDateInput.addEventListener("changeDate", function (e) {
          const selectedDate = new Date(e.target.value);
          if (selectedDate) {
            endDatepicker.setOptions({
              minDate: selectedDate,
            });
          }
        });

        // 監聽結束日期的變更，動態更新開始日期的最大值
        endDateInput.addEventListener("changeDate", function (e) {
          const selectedDate = new Date(e.target.value);
          if (selectedDate) {
            startDatepicker.setOptions({
              maxDate: selectedDate,
            });
          }
        });
      });
    </script>
