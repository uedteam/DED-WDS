<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../public/styles/globals.css" />
    <link rel="stylesheet" href="../public/styles/custom.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button</title>
    <style>
      .ded-dropdown-menu {
        display: none;
        position: absolute;
        z-index: 1000; /* 確保在頂層 */
      }
    </style>
  </head>
  <body>
    <div id="app" style="padding: 1rem">
      <button style="margin-bottom: 24px">
        <a href="../index.html">Back</a>
      </button>
      <div>
        <h2 style="font-size: 24px">Avatar-Group</h2>
        <div class="ded-avatar-group">
          <div class="ded-avatar-overlay">
            <div class="ded-avatar-container ded-avatar-container-large">
              <div class="ded-avatar ded-avatar-circle">
                <span class="ded-avatar-text ded-text-large">EA</span>
              </div>
            </div>
          </div>
          <div class="ded-avatar-overlay">
            <div class="ded-avatar-container ded-avatar-container-large">
              <div class="ded-avatar ded-avatar-circle">
                <span class="ded-avatar-text ded-text-large">KY</span>
              </div>
            </div>
          </div>
          <div class="ded-avatar-overlay">
            <div class="ded-avatar-container ded-avatar-container-large">
              <button class="ded-avatar ded-avatar-circle">
                <span class="ded-avatar-text">+3</span>
              </button>
            </div>
          </div>
        </div>
        <div id="portal-root">
          <div
            class="ded-dropdown-menu"
            style="
              top: 60px;
              left: 52px;
              transform: translate(0px, 6px);
              width: fit-content;
            "
          >
            <ul class="ded-list ded-outline">
              <li class="ded-list-item">
                <div class="ded-list-item-text">
                  <div class="ded-list-icon">
                    <div class="ded-avatar-overlay">
                      <div
                        class="ded-avatar-container ded-avatar-container-medium"
                      >
                        <div class="ded-avatar ded-avatar-circle">
                          <span class="ded-avatar-text ded-text-medium"
                            >AL</span
                          >
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="ded-list-item-label">AmosLee</div>
                </div>
              </li>
              <li class="ded-list-item">
                <div class="ded-list-item-text">
                  <div class="ded-list-icon">
                    <div class="ded-avatar-overlay">
                      <div
                        class="ded-avatar-container ded-avatar-container-medium"
                      >
                        <div class="ded-avatar ded-avatar-circle">
                          <span class="ded-avatar-text ded-text-medium"
                            >JW</span
                          >
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="ded-list-item-label">JohnWu</div>
                </div>
              </li>
              <li class="ded-list-item">
                <div class="ded-list-item-text">
                  <div class="ded-list-icon">
                    <div class="ded-avatar-overlay">
                      <div
                        class="ded-avatar-container ded-avatar-container-medium"
                      >
                        <div class="ded-avatar ded-avatar-circle">
                          <span class="ded-avatar-text ded-text-medium"
                            >PE</span
                          >
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="ded-list-item-label">Peter</div>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".ded-avatar-text").forEach((avatarText) => {
        avatarText.addEventListener("click", (event) => {
          // 找到對應的 dropdown menu
          const dropdownMenu = document.querySelector(".ded-dropdown-menu");
          if (dropdownMenu) {
            // 切換顯示狀態
            const isVisible = dropdownMenu.style.display === "block";
            dropdownMenu.style.display = isVisible ? "none" : "block";

            // 根據 avatar-text 的位置調整 dropdown 位置
            if (!isVisible) {
              const rect = event.target.getBoundingClientRect();
              dropdownMenu.style.top = `${rect.bottom}px`;
              dropdownMenu.style.left = `${rect.left}px`;
            }
          }
        });
      });
    </script>
  </body>
</html>
