    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // 獲取所有 checkbox 容器
        const containers = document.querySelectorAll(".ded-checkbox-container");

        // 遍歷每個容器處理對應的 checkbox
        containers.forEach((container) => {
          const checkboxes = container.querySelectorAll(".ded-checkbox-input");

          checkboxes.forEach((checkbox) => {
            checkbox.addEventListener("change", function () {
              const icon = this.nextElementSibling; // 找到 checkbox 對應的圖標容器

              if (checkbox.checked) {
                icon.classList.remove("ded-checkbox-unchecked");
                icon.classList.add("ded-checkbox-checked");

                // 動態添加 SVG
                if (!icon.querySelector("svg")) {
                  const svg = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                  );
                  svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                  svg.setAttribute("height", "100%");
                  svg.setAttribute("viewBox", "0 -960 960 960");
                  svg.setAttribute("width", "100%");
                  svg.setAttribute("fill", "currentColor");

                  const path = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                  );
                  path.setAttribute(
                    "d",
                    "M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"
                  );

                  svg.appendChild(path);
                  icon.appendChild(svg);
                }
              } else {
                icon.classList.remove("ded-checkbox-checked");
                icon.classList.add("ded-checkbox-unchecked");

                // 移除 SVG
                const svg = icon.querySelector("svg");
                if (svg) {
                  icon.removeChild(svg);
                }
              }
            });
          });
        });
      });
    </script>
