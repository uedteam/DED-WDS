<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../public/styles/globals.css" />
    <link rel="stylesheet" href="../public/styles/custom.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
  </head>
  <body>
    <div id="app" style="padding: 1rem">
      <button style="margin-bottom: 24px">
        <a href="../index.html">Back</a>
      </button>
      <div>
        <h2 style="font-size: 24px">Navbar</h2>
        <h3 style="font-size: 16px; margin-bottom: 8px; margin-left: 8px">
          預設項目
        </h3>
        <nav class="navbar">
          <div class="navbar-menu">
            <button
              class="ded-button ded-button-fit ded-text-medium ded-button-text ded-button-text-primary"
            >
              <div class="ded-button-content">
                <img
                  src="https://storage.googleapis.com/ded-wds-bucket/AUO_LOGO.svg"
                  alt="Logo"
                  class="navbar-logo"
                />
              </div>
            </button>
            <ul class="navbar-links">
              <button
                class="ded-button ded-button-fit ded-text-medium ded-button-text ded-button-text-primary"
              >
                <div class="ded-button-content">Products</div></button
              ><button
                class="ded-button ded-button-fit ded-text-medium ded-button-text ded-button-text-primary"
              >
                <div class="ded-button-content">Solutions</div></button
              ><button
                class="ded-button ded-button-fit ded-text-medium ded-button-text ded-button-text-primary"
              >
                <div class="ded-button-content">About</div></button
              ><button
                class="ded-button ded-button-fit ded-text-medium ded-button-text ded-button-text-primary"
              >
                <div class="ded-button-content">Technologies</div>
              </button>
            </ul>
          </div>
          <div class="navbar-feature">
            <form class="navbar-form-search">
              <div class="ded-input-container">
                <div class="ded-input-group ded-text-medium undefined">
                  <label for="ded-input" class="ded-input-icon ded-icon-medium"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      height="20"
                      viewBox="0 -960 960 960"
                      width="20"
                      fill="currentColor"
                    >
                      <path
                        d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"
                      ></path></svg></label
                  ><input
                    id="ded-input"
                    type="text"
                    class="ded-input ded-text-medium ded-input-prefix"
                    placeholder="Search"
                    value=""
                  />
                  <div class="ded-input-feat-icon"></div>
                </div>
                <small class="ded-input-hint undefined"></small>
              </div>
            </form>
            <div class="navbar-icons">
              <div class="navbar-icons-icon">
                <div class="ded-badge-container">
                  <svg
                    width="24"
                    height="24"
                    viewBox="0 0 46 56"
                    fill="currentColor"
                    xmlns="http://www.w3.org/2000/svg"
                    class="navbar-icons-svg"
                  >
                    <path
                      d="M0.489258 47.4522V43.2689H6.06704V22.0734C6.06704 18.1689 7.21745 14.6712 9.51829 11.5802C11.8191 8.48915 14.852 6.54854 18.617 5.75836V4.22447C18.617 3.06243 19.0238 2.0747 19.8372 1.26128C20.6506 0.447851 21.6383 0.0411377 22.8004 0.0411377C23.9624 0.0411377 24.9501 0.447851 25.7636 1.26128C26.577 2.0747 26.9837 3.06243 26.9837 4.22447V5.75836C30.7487 6.54854 33.7816 8.48915 36.0825 11.5802C38.3833 14.6712 39.5337 18.1689 39.5337 22.0734V43.2689H45.1115V47.4522H0.489258ZM22.8004 55.8189C21.2665 55.8189 19.9534 55.2728 18.8611 54.1804C17.7688 53.0881 17.2226 51.775 17.2226 50.2411H28.3781C28.3781 51.775 27.832 53.0881 26.7397 54.1804C25.6474 55.2728 24.3343 55.8189 22.8004 55.8189ZM10.2504 43.2689H35.3504V22.0734C35.3504 18.5872 34.1302 15.6241 31.69 13.1838C29.2497 10.7435 26.2865 9.52336 22.8004 9.52336C19.3143 9.52336 16.3511 10.7435 13.9108 13.1838C11.4705 15.6241 10.2504 18.5872 10.2504 22.0734V43.2689Z"
                    ></path>
                  </svg>
                  <div
                    class="ded-badge ded-badge-color-error ded-badge-dot"
                  ></div>
                </div>
              </div>
              <div class="navbar-icons-icon">
                <div class="ded-avatar-overlay">
                  <div class="ded-avatar-container ded-avatar-container-small">
                    <div class="ded-avatar ded-avatar-circle">
                      <div class="ded-image-cover-container ratio-1x1">
                        <img
                          class="ded-image-cover cover"
                          src="https://storage.googleapis.com/ded-wds-bucket/lion.png"
                          alt="Avatar"
                        />
                      </div>
                    </div>
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      height="100%"
                      viewBox="0 -960 960 960"
                      width="100%"
                      fill="currentColor"
                      class="ded-avatar-icon ded-avatar-icon-small ded-avatar-icon-online"
                    >
                      <path
                        d="m424-408-86-86q-11-11-28-11t-28 11q-11 11-11 28t11 28l114 114q12 12 28 12t28-12l226-226q11-11 11-28t-11-28q-11-11-28-11t-28 11L424-408Zm56 328q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"
                      ></path>
                    </svg>
                  </div>
                </div>
              </div>
            </div>
            <button class="navbar-switch">
              <div class="navbar-switch-bar"></div>
              <div class="navbar-switch-bar"></div>
              <div class="navbar-switch-bar"></div>
              <span class="navbar-switch-sr-only">切換選單</span>
            </button>
          </div>
        </nav>
      </div>
    </div>
  </body>
</html>
