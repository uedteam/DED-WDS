<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../public/styles/globals.css" />
    <link rel="stylesheet" href="../public/styles/custom.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button</title>
  </head>
  <body>
    <div id="app" style="padding: 1rem">
      <button style="margin-bottom: 24px">
        <a href="../index.html">Back</a>
      </button>
      <div>
        <h2 style="font-size: 24px; margin-bottom: 16px">Slider</h2>
        <h3 style="font-size: 16px; margin-bottom: 8px; margin-left: 8px">
          預設項目
        </h3>
        <div
          class="ded-slider-container ded-slider-container-range"
          style="--progress: 54%"
          style="margin-bottom: 24px"
        >
          <div class="ded-slider-wrapper">
            <div class="ded-slider-range ded-slider-range-start">-100</div>
            <input
              type="range"
              min="-100"
              max="100"
              step="1"
              class="ded-slider"
              value="8"
            />
            <div class="ded-slider-range ded-slider-range-end">100</div>
          </div>
          <div
            id="tooltip"
            class="ded-slider-tooltip"
            style="left: 110.44px; transform: translateX(-50%)"
          >
            <div>8<span>℃</span></div>
          </div>
        </div>
        <h3 style="font-size: 16px; margin-bottom: 8px; margin-left: 8px">
          顯示目前值
        </h3>
        <div
          class="ded-slider-container ded-slider-container-fluid"
          style="--progress: 54%"
          style="margin-bottom: 24px"
        >
          <div class="ded-slider-wrapper">
            <input
              type="range"
              min="-100"
              max="100"
              step="1"
              class="ded-slider"
              value="8"
            />
          </div>
          <div
            id="tooltip"
            class="ded-slider-tooltip"
            style="left: 155.8px; transform: translateX(-50%)"
          >
            <div>8<span>℃</span></div>
          </div>
        </div>
        <h3 style="font-size: 16px; margin-bottom: 8px; margin-left: 8px">
          顯示範圍
        </h3>
        <div
          class="ded-slider-container ded-slider-container-range"
          style="--progress: 54%"
        >
          <div class="ded-slider-wrapper">
            <div class="ded-slider-range ded-slider-range-start">-100</div>
            <input
              type="range"
              min="-100"
              max="100"
              step="1"
              class="ded-slider"
              value="8"
            />
            <div class="ded-slider-range ded-slider-range-end">100</div>
          </div>
          <div
            id="tooltip"
            class="ded-slider-tooltip"
            style="left: 110.44px; transform: translateX(-50%)"
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
